name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    container:
      # Keep aligned with the Playwright version in pnpm-lock.yaml.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run checks
        env:
          # Firefox requires HOME to be owned by the container's current user.
          HOME: /root
        run: pnpm check

  release:
    name: Release
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    env:
      LEFTHOOK: '0'
    steps:
      - name: Create release GitHub App token
        if: ${{ vars.RELEASE_APP_CLIENT_ID != '' }}
        id: release-app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.release-app.outputs.token || github.token }}
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install npm with trusted publishing support
        # Node 22 includes npm 10; OIDC publishing requires npm >=11.5.1.
        run: |
          npm install --global npm@11
          npm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build package
        run: pnpm build
      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.release-app.outputs.token || github.token }}
        run: pnpm release
